<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>山河无名 V4：变世轮回版</title>
  <style>
    :root {
      --bg: #13100b;
      --panel: #251b12;
      --text: #f6ecd8;
      --muted: #bcae96;
      --accent: #d7aa62;
      --accent2: #e7c685;
      --good: #83a66e;
      --danger: #c7654d;
      --blue: #83a4bd;
      --purple: #c59adf;
      --line: rgba(255,255,255,0.13);
      --shadow: rgba(0,0,0,0.38);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Microsoft YaHei", "PingFang SC", "Noto Serif SC", system-ui, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 8% 8%, rgba(215,170,98,0.16), transparent 24%),
        radial-gradient(circle at 88% 14%, rgba(131,164,189,0.12), transparent 26%),
        radial-gradient(circle at 50% 100%, rgba(197,154,223,0.10), transparent 30%),
        linear-gradient(135deg, #0d0a07, var(--bg));
      overflow-x: hidden;
    }

    .app {
      max-width: 1260px;
      margin: 0 auto;
      padding: 28px 18px 52px;
    }

    header {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 16px;
      align-items: start;
      margin-bottom: 18px;
    }

    .title {
      border-left: 5px solid var(--accent);
      padding-left: 14px;
    }

    h1 {
      margin: 0;
      font-size: clamp(32px, 5vw, 58px);
      letter-spacing: 0.1em;
      font-weight: 900;
    }

    .subtitle {
      margin-top: 8px;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.8;
    }

    .top-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    button {
      cursor: pointer;
      border: 1px solid rgba(215,170,98,0.45);
      background: linear-gradient(180deg, #4d351c, #2b1e12);
      color: var(--text);
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 15px;
      transition: transform .08s ease, border-color .15s ease, background .15s ease;
    }

    button:hover {
      transform: translateY(-1px);
      border-color: var(--accent);
      background: linear-gradient(180deg, #604324, #352415);
    }

    button.secondary {
      background: transparent;
      border-color: rgba(255,255,255,0.22);
      color: var(--muted);
    }

    button.secondary:hover {
      color: var(--text);
      border-color: rgba(255,255,255,0.45);
    }

    .grid {
      display: grid;
      grid-template-columns: 350px 1fr;
      gap: 18px;
    }

    .panel {
      background: linear-gradient(180deg, rgba(49,36,22,0.94), rgba(29,21,14,0.94));
      border: 1px solid var(--line);
      border-radius: 18px;
      box-shadow: 0 16px 40px var(--shadow);
    }

    .side {
      padding: 18px;
      position: sticky;
      top: 16px;
      align-self: start;
      max-height: calc(100vh - 32px);
      overflow: auto;
    }

    .main {
      padding: 22px;
      min-height: 720px;
      display: flex;
      flex-direction: column;
    }

    .seal {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: #20160c;
      background: var(--accent);
      font-weight: 900;
      border-radius: 999px;
      padding: 6px 12px;
      margin-bottom: 12px;
      font-size: 13px;
    }

    .life-meta {
      display: grid;
      gap: 8px;
      margin-bottom: 16px;
      color: var(--muted);
      line-height: 1.7;
      font-size: 14px;
    }

    .life-meta strong { color: var(--text); }

    .section-title {
      margin: 20px 0 10px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--line);
      color: var(--accent);
      font-weight: 900;
      letter-spacing: 0.06em;
    }

    .stat { margin: 8px 0; }

    .stat-row {
      display: grid;
      grid-template-columns: 76px 1fr 34px;
      gap: 8px;
      align-items: center;
      font-size: 13px;
      color: var(--muted);
    }

    .bar {
      height: 8px;
      border-radius: 99px;
      background: rgba(255,255,255,0.10);
      overflow: hidden;
    }

    .bar > span {
      display: block;
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #84623a, var(--accent));
      border-radius: inherit;
      transition: width .2s ease;
    }

    .bar.context > span { background: linear-gradient(90deg, #586f48, var(--good)); }
    .bar.danger > span { background: linear-gradient(90deg, #7d3029, var(--danger)); }
    .bar.world > span { background: linear-gradient(90deg, #536e7e, var(--blue)); }

    .event-card {
      border: 1px solid var(--line);
      border-radius: 16px;
      background:
        linear-gradient(rgba(255,255,255,0.035), rgba(255,255,255,0.012)),
        rgba(0,0,0,0.13);
      padding: 22px;
      margin-bottom: 16px;
    }

    .history-card {
      border-color: rgba(131,164,189,0.38);
      background:
        radial-gradient(circle at top right, rgba(131,164,189,0.13), transparent 36%),
        rgba(0,0,0,0.15);
    }

    .relation-card {
      border-color: rgba(231,198,133,0.48);
      background:
        radial-gradient(circle at top left, rgba(231,198,133,0.13), transparent 38%),
        rgba(0,0,0,0.16);
    }

    .karma-card {
      border-color: rgba(197,154,223,0.45);
      background:
        radial-gradient(circle at top right, rgba(197,154,223,0.13), transparent 34%),
        rgba(0,0,0,0.16);
    }

    .event-kicker {
      color: var(--accent);
      font-size: 14px;
      font-weight: 900;
      margin-bottom: 8px;
      letter-spacing: 0.08em;
    }

    .history-card .event-kicker { color: #a9c2d3; }
    .karma-card .event-kicker { color: #d7a8ee; }

    .event-title {
      margin: 0 0 12px;
      font-size: clamp(24px, 3vw, 34px);
      letter-spacing: 0.04em;
    }

    .event-text {
      color: #eadcc4;
      line-height: 2;
      font-size: 17px;
      white-space: pre-line;
    }

    .choices {
      display: grid;
      gap: 12px;
      margin-top: auto;
    }

    .choice {
      text-align: left;
      width: 100%;
      padding: 14px 16px;
      border-radius: 14px;
      border-color: rgba(215,170,98,0.34);
      background: rgba(0,0,0,0.22);
    }

    .choice:hover { background: rgba(215,170,98,0.12); }

    .choice-title {
      display: block;
      color: var(--text);
      font-weight: 900;
      margin-bottom: 5px;
      font-size: 16px;
    }

    .choice-desc {
      display: block;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.65;
    }

    .log {
      max-height: 190px;
      overflow: auto;
      padding-right: 5px;
      color: var(--muted);
      line-height: 1.7;
      font-size: 13px;
    }

    .log p {
      margin: 0 0 9px;
      padding-bottom: 9px;
      border-bottom: 1px dashed rgba(255,255,255,0.10);
    }

    .imprint {
      display: inline-block;
      margin: 5px 6px 2px 0;
      padding: 5px 9px;
      border: 1px solid rgba(215,170,98,0.35);
      border-radius: 999px;
      color: var(--accent);
      background: rgba(215,170,98,0.08);
      font-size: 13px;
    }

    .tag {
      display: inline-block;
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 999px;
      padding: 2px 8px;
      color: var(--muted);
      margin: 2px 4px 2px 0;
      font-size: 12px;
    }

    .scenario-card, .person-card, .cause-card {
      border: 1px solid rgba(255,255,255,0.10);
      border-radius: 12px;
      padding: 10px;
      background: rgba(0,0,0,0.13);
      color: var(--muted);
      font-size: 13px;
      line-height: 1.65;
      margin-bottom: 8px;
    }

    .scenario-card strong, .person-card strong, .cause-card strong {
      color: var(--text);
    }

    .person-state {
      display: inline-block;
      margin-top: 5px;
      padding: 2px 7px;
      border-radius: 999px;
      color: #1d150c;
      background: var(--accent2);
      font-size: 12px;
      font-weight: 900;
    }

    .cause-card {
      border-color: rgba(197,154,223,0.25);
    }

    .small-note {
      color: var(--muted);
      line-height: 1.7;
      font-size: 13px;
      margin-top: 12px;
    }

    .history-item {
      padding: 10px 0;
      border-bottom: 1px dashed rgba(255,255,255,0.10);
      color: var(--muted);
      line-height: 1.7;
      font-size: 13px;
    }

    .history-item strong { color: var(--text); }

    @media (max-width: 900px) {
      header { grid-template-columns: 1fr; }
      .top-actions { justify-content: flex-start; }
      .grid { grid-template-columns: 1fr; }
      .side { position: static; max-height: none; }
    }
  </style>
</head>

      "组织开荒":{"民望":2,"百姓关系":2,"危险值":1}
    };

    let game = null;

    function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
    function shuffle(arr) { return [...arr].sort(() => Math.random() - 0.5); }
    function clamp(v, min=-5, max=18) { return Math.max(min, Math.min(max, v)); }

    function defaultStats() {
      const stats = {};
      [...abilityKeys, ...spiritKeys, ...contextKeys, ...worldKeys].forEach(k => stats[k] = 0);
      stats["财富"] = 2;
      stats["百姓关系"] = 1;
      return stats;
    }

    function loadLegacy() {
      try {
        return JSON.parse(localStorage.getItem("swh_legacy_v4")) || { lives:0, imprints:[], causes:[], chronicles:[] };
      } catch {
        return { lives:0, imprints:[], causes:[], chronicles:[] };
      }
    }

    function saveLegacy(legacy) {
      localStorage.setItem("swh_legacy_v4", JSON.stringify(legacy));
    }

    function applyDelta(delta) {
      Object.entries(delta || {}).forEach(([k, v]) => {
        game.stats[k] = clamp((game.stats[k] || 0) + v);
      });
    }

    function chooseScenario(legacy) {
      const recent = (legacy.chronicles || []).slice(0, 2).map(c => c.scenarioId);
      let pool = scenarios.filter(s => !recent.includes(s.id));
      if (!pool.length) pool = scenarios;

      const causes = legacy.causes || [];
      const hasWarDebt = causes.some(c => /仇恨|亏欠|白骨|粮/.test(c.type + c.name));
      const hasRecord = causes.some(c => /传承|名册|残卷|记录/.test(c.type + c.name));
      const hasQin = causes.some(c => /秦|统一/.test(c.name + c.source));

      if (hasWarDebt && Math.random() < 0.35) {
        const warPool = pool.filter(s => s.tags.includes("长平") || s.tags.includes("战后") || s.tags.includes("流民"));
        if (warPool.length) return pick(warPool);
      }
      if (hasRecord && Math.random() < 0.35) {
        const recordPool = pool.filter(s => s.tags.includes("旧国") || s.tags.includes("学宫") || s.tags.includes("百家"));
        if (recordPool.length) return pick(recordPool);
      }
      if (hasQin && Math.random() < 0.35) {
        const qinPool = pool.filter(s => s.tags.includes("秦法") || s.tags.includes("秦势"));
        if (qinPool.length) return pick(qinPool);
      }
      return pick(pool);
    }

    function applyImprints(stats, imprints) {
      const map = {
        "仁心":["仁心","医术","百姓关系"],
        "野望":["野望","谋略","声名"],
        "忠义":["忠义","武艺","官府信任"],
        "清醒":["清醒","文才","谋略"],
        "风骨":["风骨","声名","清醒"],
        "机变":["机变","商识","谋略"],
        "逐利":["逐利","商识","财富"],
        "悲悯":["悲悯","仁心","医术"]
      };
      imprints.slice(-5).forEach(m => (map[m] || []).forEach(k => stats[k] = (stats[k] || 0) + 1));
    }

    function clonePerson(tpl, id) {
      return { id, name:tpl.name, role:tpl.role, title:tpl.title, line:tpl.line, trust:1, tie:1, debt:0, rift:0, status:"同行", alive:true };
    }

    function generatePeople() {
      game.people = [
        clonePerson(pick(personTemplates.mentor), "mentor"),
        clonePerson(pick(personTemplates.hometown), "hometown"),
        clonePerson(pick(personTemplates.era), "era")
      ];
    }

    function addRoutePerson() {
      if (!game.route || game.people.some(p => p.id === "route")) return;
      game.people.push(clonePerson(personTemplates.route[game.route], "route"));
    }

    function personById(id) { return game.people.find(p => p.id === id); }

    function updatePerson(id, changes) {
      const p = personById(id);
      if (!p) return;
      ["trust","tie","debt","rift"].forEach(k => {
        if (changes[k]) p[k] = clamp((p[k] || 0) + changes[k], -3, 9);
      });
      if (changes.status) p.status = changes.status;
    }

    function addCause(name, type, source, strength=1, personId=null) {
      const p = personId ? personById(personId) : null;
      const c = {
        id:"cause_" + Date.now() + "_" + Math.floor(Math.random()*9999),
        name, type, source, strength,
        person:p ? p.name : "",
        scenario:game.scenario.name,
        scenarioId:game.scenario.id,
        route:game.route || "未定",
        life:game.lifeNo,
        state:"潜伏"
      };
      game.causes.unshift(c);
      game.causes = game.causes.slice(0, 12);
      return c;
    }

    function inferCause(ev, choice) {
      if (choice.causeType) return addCause(`${ev.title}：${choice.causeType}之因`, choice.causeType, choice.text, 1, choice.personId);
      const text = choice.text + " " + (choice.desc || "");
      if (/救|收留|保护|分粮|开仓|护送|藏/.test(text)) return addCause(`${ev.title}：恩义之因`, "恩义", choice.text);
      if (/高价|交出|屠|销毁|利用|严惩/.test(text)) return addCause(`${ev.title}：亏欠之因`, "亏欠", choice.text);
      if (/记录|保存|写下|名册|整理/.test(text)) return addCause(`${ev.title}：传承之因`, "传承", choice.text);
      if (/拒|抗|守旧|死守/.test(text)) return addCause(`${ev.title}：执念之因`, "执念", choice.text);
      return null;
    }

    function startNewLife(resetLegacy) {
      const legacy = resetLegacy ? { lives:0, imprints:[], causes:[], chronicles:[] } : loadLegacy();
      if (resetLegacy) saveLegacy(legacy);

      const scenario = chooseScenario(legacy);
      const stats = defaultStats();
      applyImprints(stats, legacy.imprints);
      applyDeltaTo(stats, scenario.mods);

      game = {
        lifeNo: legacy.lives + 1,
        scenario,
        origin: pick(origins),
        age: 13,
        phase:"prologue",
        step:0,
        route:null,
        stats,
        people:[],
        causes:[],
        log:[],
        deckHistory:[],
        deckRoute:[],
        currentEvent:null,
        karmaPlayed:false,
        ended:false
      };

      generatePeople();

      const legacyCauses = legacy.causes || [];
      if (legacyCauses.length && Math.random() < 0.85) {
        showEvent(getKarmaEvent(pick(legacyCauses)));
        game.karmaPlayed = true;
      } else {
        showEvent(getPrologueEvent());
      }
      render();
    }

    function applyDeltaTo(stats, delta) {
      Object.entries(delta || {}).forEach(([k,v]) => stats[k] = clamp((stats[k] || 0) + v));
    }

    function getPrologueEvent() {
      const ev = pick(prologuePool);
      return {
        type:"life",
        title:ev.title,
        kicker:"起身 · " + game.scenario.period,
        text:ev.text + `\n\n此世你生在${game.scenario.place}，正逢「${game.scenario.name}」。\n\n${game.scenario.mood}`,
        choices:shuffle(ev.choices).slice(0,3)
      };
    }

    function getKarmaEvent(cause) {
      return {
        type:"karma",
        title:"蛛网上的旧因",
        kicker:"因果蛛网 · 前世回响",
        text:`你尚未真正入世，便反复梦见一段前世未尽的因果。\n\n「${cause.name}」\n\n它来自上一段山河，也许与${cause.person || "某个无名之人"}有关。你醒来后记不清细节，只觉得此世的风里，有一根看不见的丝牵着你。\n\n这一次，你未必还会走到同一个地方。`,
        choices:[
          {text:"顺着牵引，尝试弥补", desc:"不知道欠了谁，也愿先向人间低头。", delta:{"仁心":1,"悲悯":1,"清醒":1}, causeType:"轮回果"},
          {text:"把它当作警示", desc:"前世不可追，今生少犯同样的错。", delta:{"清醒":2,"机变":1}, causeType:"伏因"},
          {text:"斩断旧梦", desc:"若因果无穷无尽，人还如何重新开始？", delta:{"野望":1,"风骨":1}, causeType:"执念"}
        ]
      };
    }

    function determineRoute() {
      let best = "农人", bestScore = -999;
      routeNames.forEach(route => {
        const weights = routeWeights[route];
        let score = Math.random() * 2.2;
        Object.entries(weights).forEach(([k,w]) => score += (game.stats[k] || 0) * w);
        if (score > bestScore) { bestScore = score; best = route; }
      });
      return best;
    }

    function buildDecks() {
      const tags = game.scenario.tags;
      const matched = historyPool.filter(e => e.tags.some(t => tags.includes(t)));
      const fallback = historyPool.filter(e => !matched.includes(e));
      game.deckHistory = shuffle([...matched, ...shuffle(fallback).slice(0, 4)]).slice(0, 5);
      game.deckRoute = shuffle(routeEventPool[game.route]).slice(0, 4);
    }

    function nextEvent() {
      if (game.phase === "prologue") {
        if (game.currentEvent && game.currentEvent.type === "karma") {
          showEvent(getPrologueEvent());
          return;
        }

        game.step += 1;
        if (game.step < 2) {
          showEvent(getPrologueEvent());
          return;
        }

        game.route = determineRoute();
        addRoutePerson();
        buildDecks();
        game.log.unshift(`道路渐显：你这一世更接近「${game.route}」。`);
        game.phase = "main";
        game.step = 0;
        showEvent(makeHistoryEvent(game.deckHistory.shift()));
        return;
      }

      if (game.phase === "main") {
        game.step += 1;
        if (game.step >= 8) {
          endLife();
          return;
        }

        if (game.step === 3 || game.step === 6) {
          showEvent(makeRelationEvent());
          return;
        }

        if (game.step % 2 === 1 && game.deckRoute.length) {
          showEvent(makeRouteEvent(game.deckRoute.shift()));
          return;
        }

        if (game.deckHistory.length) {
          showEvent(makeHistoryEvent(game.deckHistory.shift()));
          return;
        }

        if (game.deckRoute.length) {
          showEvent(makeRouteEvent(game.deckRoute.shift()));
          return;
        }

        endLife();
      }
    }

    function andFalse(){ return false; }

    function makeHistoryEvent(raw) {
      return {
        ...raw,
        type:"history",
        text:raw.text.replaceAll("{place}", game.scenario.place),
        choices:shuffle(raw.choices).slice(0,3)
      };
    }

    function makeRouteEvent(raw) {
      const [title, body, opts] = raw;
      const choices = shuffle(opts).slice(0,3).map(o => ({
        text:o,
        desc:routeChoiceDesc(o),
        delta:optionDeltas[o] || {"清醒":1}
      }));
      return {
        type:"route",
        title,
        kicker:`人生线 · ${game.route}`,
        text:`${body}\n\n此时你走在「${game.route}」之路上，但${game.scenario.name}的风仍在推着你。你不是在空白世界里选择，而是在${game.scenario.place}的尘土里承担选择。`,
        choices
      };
    }

    function routeChoiceDesc(text) {
      const map = {
        "高价售粮":"利益清楚，代价也清楚。",
        "平价开仓":"你让铜钱退到人命之后。",
        "执行军令":"军令如山，人命如草。",
        "抗命护民":"这一刻，你把刀口转向了命令。",
        "暗改讽词":"一句唱词，可能比刀更危险。",
        "保存副本":"真相先活下来，人才有来日。",
        "另写无名录":"没有名字的人，也该有一笔。",
        "公开图纸":"你把技术交给需要它的人。",
        "顺着牵引，尝试弥补":"你不知道自己欠了谁。"
      };
      return map[text] || "这不是唯一的路，但会成为一个因。";
    }

    function makeRelationEvent() {
      const p = pick(game.people.filter(p => p.alive));
      return {
        type:"relation",
        personId:p.id,
        title:`${p.name}的请求`,
        kicker:`故人系统 · ${p.role}`,
        text:`${p.name}，${p.title}。\n\n你们在这一世相识。${p.name}曾说：“${p.line}”\n\n如今正逢「${game.scenario.name}」。历史车轮从${game.scenario.place}碾过，${p.name}把一件难事交到你面前。\n\n你知道，这不只是关系选择，也会成为因果网上的一根丝。`,
        choices:[
          {text:`答应${p.name}，将此事扛下来`, desc:"你把这个人的命运接到自己身上。", delta:{"仁心":1,"悲悯":1,"危险值":1}, rel:{[p.id]:{trust:2,tie:1,debt:-1}}, causeType:"恩义", personId:p.id},
          {text:`拒绝${p.name}，让他自己承受`, desc:"你没有义务替每个人挡住时代。", delta:{"清醒":1,"危险值":-1}, rel:{[p.id]:{trust:-1,rift:2,debt:1}}, causeType:"亏欠", personId:p.id},
          {text:`给${p.name}一条退路，但不亲自入局`, desc:"不冷眼旁观，也不把自己全部押上。", delta:{"机变":1,"清醒":1}, rel:{[p.id]:{trust:1,tie:1}}, causeType:"伏因", personId:p.id},
          {text:`利用${p.name}，换取更大的机会`, desc:"乱世里，人情也会被放上秤盘。", delta:{"野望":1,"机变":1,"人脉":1}, rel:{[p.id]:{trust:-2,rift:2,debt:2}}, causeType:"仇恨", personId:p.id}
        ]
      };
    }

    function choose(i) {
      if (!game || game.ended) return;
      const ev = game.currentEvent;
      const c = ev.choices[i];

      applyDelta(c.delta || {});
      if (c.rel) Object.entries(c.rel).forEach(([id, ch]) => updatePerson(id, ch));
      const born = inferCause(ev, c);
      if (born) game.log.unshift(`因果已生：${born.name}`);
      game.log.unshift(`【${ev.title}】${c.text}`);
      game.age += Math.floor(Math.random()*4) + 2;

      nextEvent();
      render();
    }

    function showEvent(ev) {
      game.currentEvent = ev;
      let cls = "event-card";
      if (ev.type === "history") cls = "event-card history-card";
      if (ev.type === "relation") cls = "event-card relation-card";
      if (ev.type === "karma") cls = "event-card karma-card";

      document.getElementById("eventArea").innerHTML = `
        <section class="${cls}">
          <div class="event-kicker">${ev.kicker}</div>
          <h2 class="event-title">${ev.title}</h2>
          <div class="event-text">${ev.text}</div>
        </section>
      `;

      document.getElementById("choices").innerHTML = ev.choices.map((c, i) => `
        <button class="choice" onclick="choose(${i})">
          <span class="choice-title">${c.text}</span>
          <span class="choice-desc">${c.desc || ""}</span>
        </button>
      `).join("");
    }

    function topSpirits() {
      return spiritKeys
        .map(k => [k, game.stats[k] || 0])
        .sort((a,b) => b[1] - a[1])
        .slice(0,3)
        .map(x => x[0]);
    }

    function relationshipEnding() {
      const sorted = [...game.people].sort((a,b) => (b.tie + b.trust + b.debt + b.rift) - (a.tie + a.trust + a.debt + a.rift));
      const p = sorted[0];
      if (!p) return "这一世，没有人真正记住你。";
      if (p.rift >= 4) return `故人回望：${p.name}没有原谅你。有人提起你的名字，${p.name}只说：“他也曾有选择。”`;
      if (p.debt >= 3) return `故人回望：你始终欠着${p.name}一件事。那件事没有写进史书，却在你临终前反复回来。`;
      if (p.trust >= 4) return `故人回望：${p.name}一直相信你。你死后，${p.name}替你收起遗物，说：“他这一世，没有白走。”`;
      if (p.tie >= 4) return `故人回望：乱世把你和${p.name}推向不同方向，但牵挂没有断。`;
      return `故人回望：${p.name}记得你。记得并不轰烈，只是在某个黄昏忽然想起，你们曾一同走过一段乱世。`;
    }

    function causeEndingText() {
      if (!game.causes.length) return "此世因果：足迹很浅，尘土很快盖住了它。";
      return "此世因果：\n" + game.causes.slice(0,3).map(c => {
        const tail = c.type === "恩义" ? "此因或将结为援手。" :
          c.type === "亏欠" ? "此因或将结为遗憾。" :
          c.type === "仇恨" ? "此因或将结为清算。" :
          c.type === "传承" ? "此因或将结为后世残卷。" :
          c.type === "轮回果" ? "此因已跨过一世，仍未止息。" :
          "此因潜伏，尚未结果。";
        return `你种下「${c.name}」。${tail}`;
      }).join("\n");
    }

    function endingTone() {
      const s = game.stats;
      if ((s["秦势"] || 0) >= 5) return "这一世，你多次看向西方。你未必相信秦，却知道旧天下已经很难自己修好裂缝。";
      if ((s["旧礼"] || 0) >= 5) return "这一世，你始终听见旧礼的回声。哪怕它已残破，你仍不愿它被彻底嘲笑。";
      if ((s["民怨"] || 0) >= 5 || (s["饥荒"] || 0) >= 4) return "这一世，你见过太多底层的苦。诸侯谈天下，百姓谈明日有没有粮。";
      if ((s["变法"] || 0) >= 5) return "这一世，你看见新法如刀。它削开旧贵族，也削痛了普通人的骨头。";
      return "这一世，你被历史车轮推着向前。你不能决定天下如何转动，却决定自己如何站立。";
    }

    const endingByRoute = {
      "隐士":"你在山林与竹简之间度过此生。有人说你逃避乱世，也有人因你的文字保住一点清明。",
      "仕官":"你曾相信制度能救天下。后来你见过律令救人，也见过律令杀人。",
      "谋士":"你以言语入局，以谋略改命。临终才觉得天下不像棋盘，棋子不会哭，人会。",
      "武将":"你从卒伍中起身，见过战旗如云，也见过尸骨塞路。刀兵能定山河，却不能回答山河为何而定。",
      "医者":"你救过的人大多不会出现在史书里。可病人的手总是一样冷，你握过那些手，此生便没有白活。",
      "戏子":"你在台上演过忠臣、逆贼、亡国人、归乡客。戏里说的，有时才是世上最真的话。",
      "商贾":"你算过无数账。到最后才明白，天下还有一种账不写在竹简上。",
      "工匠":"你造过犁、渠、弩、车、器。有些救人，有些杀人。器物有声，只是史书少听。",
      "吏官":"你不是高官，却最知道王朝如何抵达百姓门前：一张税单，一笔户籍，一卷案册。",
      "农人":"你承受了王朝最沉的重量。史书写王侯，土地记百姓。"
    };

    function endLife() {
      game.ended = true;
      const marks = topSpirits();
      const legacy = loadLegacy();
      legacy.lives = game.lifeNo;
      legacy.imprints = [...(legacy.imprints || []), ...marks].slice(-18);
      legacy.causes = [...(legacy.causes || []), ...(game.causes || [])].slice(-30);
      legacy.chronicles.unshift({
        lifeNo:game.lifeNo,
        route:game.route,
        scenario:game.scenario.name,
        scenarioId:game.scenario.id,
        place:game.scenario.place,
        marks,
        causes:game.causes.slice(0,3).map(c => c.name)
      });
      legacy.chronicles = legacy.chronicles.slice(0,10);
      saveLegacy(legacy);

      document.getElementById("eventArea").innerHTML = `
        <section class="event-card karma-card">
          <div class="event-kicker">终章 · ${game.route} · ${game.scenario.name}</div>
          <h2 class="event-title">此世归尘</h2>
          <div class="event-text">${endingByRoute[game.route] || ""}

${endingTone()}

这一世，你留下的魂火印记是：${marks.join("、")}。

${relationshipEnding()}

${causeEndingText()}

你无名，但你确实在${game.scenario.place}活过。而你种下的因，会在某一世继续震动蛛网。</div>
        </section>
      `;

      document.getElementById("choices").innerHTML = `
        <button class="choice" onclick="startNewLife(false)">
          <span class="choice-title">转入下一世</span>
          <span class="choice-desc">保留魂火与因果，让下一世不再只是重复。</span>
        </button>
        <button class="choice" onclick="resetAll()">
          <span class="choice-title">清空轮回，重新开始</span>
          <span class="choice-desc">删除本地存档、印记与因果蛛网。</span>
        </button>
      `;
      render();
    }

    function renderStats(containerId, keys, type) {
      const el = document.getElementById(containerId);
      el.innerHTML = keys.map(k => {
        const val = game ? (game.stats[k] || 0) : 0;
        const pct = Math.max(0, Math.min(100, (val + 5) / 23 * 100));
        const cls = k === "危险值" ? "danger" : type;
        return `
          <div class="stat">
            <div class="stat-row">
              <span>${k}</span>
              <div class="bar ${cls}"><span style="width:${pct}%"></span></div>
              <span>${val}</span>
            </div>
          </div>
        `;
      }).join("");
    }

    function renderPeople() {
      document.getElementById("peopleList").innerHTML = game.people.map(p => `
        <div class="person-card">
          <strong>${p.name}</strong>｜${p.role}<br/>
          ${p.title}<br/>
          <span class="person-state">${p.status}</span>
          <div>信任${p.trust}｜牵挂${p.tie}｜亏欠${p.debt}｜裂痕${p.rift}</div>
        </div>
      `).join("");
    }

    function renderCauses(legacy) {
      const merged = [...(game.causes || []).slice(0,4), ...((legacy.causes || []).slice(-3).reverse())].slice(0,6);
      document.getElementById("causeList").innerHTML = merged.length ? merged.map(c => `
        <div class="cause-card">
          <strong>${c.name}</strong><br/>
          ${c.type}｜${c.scenario || "未知"}${c.person ? "｜" + c.person : ""}
          <div>状态：${c.state || "潜伏"}｜强度：${c.strength || 1}</div>
        </div>
      `).join("") : `<div class="small-note">蛛网尚空。重大选择会成为因，未来某一世或会结果。</div>`;
    }

    function renderScenario() {
      const s = game.scenario;
      document.getElementById("scenarioBox").innerHTML = `
        <div class="scenario-card">
          <strong>${s.name}</strong><br/>
          ${s.period}｜${s.year}<br/>
          地点：${s.place}<br/>
          势力：${s.state}<br/>
          <div style="margin-top:6px;">${s.mood}</div>
        </div>
      `;
    }

    function render() {
      if (!game) return;
      const legacy = loadLegacy();
      document.getElementById("lifeMeta").innerHTML = `
        <div><strong>第 ${game.lifeNo} 世</strong>｜${game.scenario.state}</div>
        <div>出身：<strong>${game.origin}</strong></div>
        <div>年龄：<strong>${game.age}</strong> 岁</div>
        <div>道路：${game.route ? `<span class="tag">${game.route}</span>` : "<strong>尚未显形</strong>"}</div>
        <div><span class="tag">${game.phase === "prologue" ? "起身" : "入世"}</span><span class="tag">${game.currentEvent?.kicker || ""}</span></div>
      `;

      renderScenario();
      renderPeople();
      renderCauses(legacy);
      renderStats("abilityStats", abilityKeys, "");
      renderStats("spiritStats", spiritKeys, "");
      renderStats("contextStats", contextKeys, "context");
      renderStats("worldStats", worldKeys, "world");

      document.getElementById("imprints").innerHTML = legacy.imprints?.length
        ? legacy.imprints.map(m => `<span class="imprint">${m}</span>`).join("")
        : `<div class="small-note">尚无。每一世终结后，会留下魂火印记。</div>`;

      document.getElementById("log").innerHTML = game.log.length
        ? game.log.map(x => `<p>${x}</p>`).join("")
        : `<p>这一世还没有留下行迹。</p>`;

      const old = document.getElementById("chronicles");
      if (old) old.remove();
      if (legacy.chronicles && legacy.chronicles.length) {
        const div = document.createElement("div");
        div.id = "chronicles";
        div.innerHTML = `
          <div class="section-title">轮回小史</div>
          ${legacy.chronicles.map(c => `
            <div class="history-item">
              <strong>第${c.lifeNo}世 · ${c.route}</strong><br/>
              ${c.scenario}｜${c.place}<br/>
              印记：${c.marks.join("、")}<br/>
              因：${(c.causes || []).slice(0,2).join("；") || "未明"}
            </div>
          `).join("")}
        `;
        document.querySelector(".side").appendChild(div);
      }
    }

    function resetAll() {
      if (confirm("确定清空《山河无名 V4》的本地轮回存档吗？")) {
        localStorage.removeItem("swh_legacy_v4");
        startNewLife(true);
      }
    }

    startNewLife(false);
  </script>
</body>
</html>
