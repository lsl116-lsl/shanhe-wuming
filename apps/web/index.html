<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="《山河无名》阶段 B 网页核心原型：第一章 ACT01—ACT02。"
    />
    <title>山河无名 · 裂钟之梦 / 旧礼无声</title>
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <a class="brand" href="/" aria-label="山河无名网页核心原型首页">
          <span class="brand-mark" aria-hidden="true">無</span>
          <span>
            <strong>山河无名</strong>
            <small>阶段 B · 网页核心原型</small>
          </span>
        </a>

        <div class="topbar-meta" aria-label="样片状态">
          <span class="status-dot"></span>
          <span id="content-version">内容载入中</span>
          <span class="divider"></span>
          <span id="playtime">00:00</span>
        </div>

        <nav class="save-actions" aria-label="存档操作">
          <button class="text-button" id="save-button" type="button">保存</button>
          <button class="text-button" id="load-button" type="button">读取</button>
          <button class="text-button" id="export-button" type="button">导出 JSON</button>
          <button class="text-button" id="import-button" type="button">导入</button>
          <button class="icon-button" id="reset-button" type="button" title="重新开始">↺</button>
          <input id="import-input" type="file" accept="application/json" hidden />
        </nav>
      </header>

      <main class="game-layout" id="game" aria-busy="true">
        <aside class="world-panel" aria-label="场景与人物状态">
          <section class="scene-art" id="scene-art" data-motif="river">
            <div class="rain-layer" aria-hidden="true"></div>
            <div class="moon" aria-hidden="true"></div>
            <div class="far-bank" aria-hidden="true"></div>
            <div class="river" aria-hidden="true"></div>
            <div class="broken-cart" aria-hidden="true"></div>
            <div class="bell-shape" aria-hidden="true"><span></span></div>
            <div class="slip-shape" aria-hidden="true">半<br />名</div>
            <div class="song-rings" aria-hidden="true"><i></i><i></i><i></i></div>
            <div class="archive-pages" aria-hidden="true"><i></i><i></i><i></i></div>
            <p class="scene-caption" id="scene-caption">洛水渡口，雨没有停。</p>
          </section>

          <section class="world-status">
            <div class="section-heading">
              <span>此刻可用</span>
              <small>资源不是分数</small>
            </div>
            <div class="resource-list" id="resource-list"></div>
          </section>

          <section class="character-status">
            <div class="section-heading">
              <span>同行者</span>
              <small>他们会记得做法</small>
            </div>
            <div id="character-list"></div>
          </section>
        </aside>

        <section class="story-panel" aria-live="polite">
          <div class="story-kicker">
            <span id="act-label">第一章 · ACT01</span>
            <span id="scene-progress">0 / 7 次选择</span>
          </div>
          <div class="story-place">
            <span id="location-label">洛水渡口</span>
            <span aria-hidden="true">·</span>
            <span id="time-label">前 286 年</span>
          </div>
          <h1 id="node-title">正在读取故事……</h1>
          <p class="speaker" id="speaker-label"></p>
          <div class="story-copy" id="story-copy"></div>
          <div class="choice-list" id="choice-list"></div>
          <div class="ending-card" id="ending-card" hidden>
            <span class="ending-seal">档</span>
            <div>
              <strong>本世档案已经生成第一行</strong>
              <p>打开右侧“档案”，比较真实发生、官档、私录与口述。</p>
            </div>
          </div>
        </section>

        <aside class="evidence-panel" aria-label="档案与调试信息">
          <div class="tab-list" role="tablist" aria-label="信息面板">
            <button class="tab active" data-tab="records" role="tab" aria-selected="true">
              档案
            </button>
            <button class="tab" data-tab="memories" role="tab" aria-selected="false">记忆</button>
            <button class="tab" data-tab="causes" role="tab" aria-selected="false">因果</button>
            <button class="tab" data-tab="events" role="tab" aria-selected="false">事件</button>
          </div>
          <div class="tab-panel active" id="records-panel" role="tabpanel"></div>
          <div class="tab-panel" id="memories-panel" role="tabpanel"></div>
          <div class="tab-panel" id="causes-panel" role="tabpanel"></div>
          <div class="tab-panel" id="events-panel" role="tabpanel"></div>
        </aside>
      </main>

      <footer class="footer">
        <span>一次选择可同时改变人物、事实、记录与后续责任。</span>
        <span id="validation-status">正在校验内容……</span>
      </footer>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <div class="fatal-error" id="fatal-error" hidden>
      <strong>样片未能启动</strong>
      <p id="fatal-message"></p>
    </div>
  </body>
</html>
